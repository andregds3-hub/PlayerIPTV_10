# nginx do container PlayerIPTV (porta interna 80; publicada como 90 no host)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Compressão: o hls.min.js cai de ~415 KB para ~130 KB
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/xml text/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Sem cache em HTML/JS/CSS durante os testes: toda atualização aparece no F5
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    # Manifesto do pacote Tizen não precisa ser público
    location = /config.xml {
        return 404;
    }
}
