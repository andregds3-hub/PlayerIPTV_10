{% extends "base.html" %}
{% block title %}Cadastro - PlayerIPTV Panel{% endblock %}

{% block body %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5" style="background: linear-gradient(135deg, #0d0d0d 0%, #1a1a2e 100%);">
    <div class="card card-dark" style="width: 100%; max-width: 500px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h2 class="text-primary fw-bold">PlayerIPTV</h2>
                <p class="text-muted">Cadastro de Revendedor</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
            </div>
            {% endif %}
            
            <form method="post" action="/register">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Usuário *</label>
                        <input type="text" name="username" class="form-control bg-dark border-secondary" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control bg-dark border-secondary" required>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nome completo</label>
                        <input type="text" name="name" class="form-control bg-dark border-secondary">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">WhatsApp</label>
                        <input type="text" name="phone" class="form-control bg-dark border-secondary" placeholder="(00) 00000-0000">
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Senha *</label>
                        <input type="password" name="password" class="form-control bg-dark border-secondary" required minlength="6">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirmar senha *</label>
                        <input type="password" name="password_confirm" class="form-control bg-dark border-secondary" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                    <i class="bi bi-person-plus me-2"></i>Criar conta
                </button>
            </form>
            
            <hr class="my-4 border-secondary">
            
            <div class="text-center">
                <p class="text-muted mb-2">Já tem conta?</p>
                <a href="/login" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Fazer login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
